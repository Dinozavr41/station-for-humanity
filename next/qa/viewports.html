<!doctype html><html lang="ru"><meta charset="utf-8"><title>SFH visual QA</title><style>body{margin:0;background:#273346}form{height:48px;display:flex;gap:14px;align-items:center;color:white;font:16px Arial}iframe{display:block;border:0;background:#031323}button,select{font:16px Arial;padding:6px}</style><form><label>Страница <select name="page"><option value="index.html">Главная</option><option value="story.html">История</option></select></label><label>Размер <select name="size"><option value="desktop">1440×1000</option><option value="mobile">390×844</option></select></label><button>Показать</button></form><iframe title="Проверяемая страница"></iframe><script>const q=new URLSearchParams(location.search);const page=q.get('page')==='story.html'?'story.html':'index.html';const mobile=q.get('size')==='mobile';document.querySelector('[name=page]').value=page;document.querySelector('[name=size]').value=mobile?'mobile':'desktop';const frame=document.querySelector('iframe');frame.width=mobile?390:1440;frame.height=mobile?844:1000;frame.src='../'+page;</script></html>
